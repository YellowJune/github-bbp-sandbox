name: Ba4Cu2HgTlNO7 force-directed local QE scan
on:
  pull_request:
    paths:
      - 'hgtlno7/qe_local_relax_scan.py'
      - '.github/workflows/hgtlno7-local-force-scan.yml'
  workflow_dispatch:

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        shorten: ['0.00','0.05','0.10','0.15','0.20']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QE 7.5
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin wget
          wget -q 'https://github.com/pranabdas/espresso/releases/download/qe-7.5-1/quantum-espresso_7.5-1_amd64.deb' -O /tmp/qe75.deb
          echo 'b759b77935649a84985a2149329a4682f084a450a013b18cf2a12ff47dedf30c  /tmp/qe75.deb' | sha256sum -c -
          sudo apt-get install -y /tmp/qe75.deb
          pip install 'numpy<2.3'
      - name: Fetch SSSP
        run: |
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.tar.gz?download=1' -O /tmp/s.tar.gz
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.json?download=1' -O /tmp/s.json
          echo 'f8cc8b73c5736fca6a9a6cb14813db9b  /tmp/s.tar.gz' | md5sum -c -
          mkdir -p /tmp/pp /tmp/local
          tar -xzf /tmp/s.tar.gz -C /tmp/pp
      - name: Scan local displacement
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python hgtlno7/qe_local_relax_scan.py \
            --shorten '${{ matrix.shorten }}' \
            --ppdir /tmp/pp --meta /tmp/s.json \
            --scratch '/tmp/local/${{ matrix.shorten }}' \
            --output 'artifacts/local_${{ matrix.shorten }}'
      - if: always()
        run: cat 'artifacts/local_${{ matrix.shorten }}/result.json' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hgtl-local-${{ matrix.shorten }}
          path: artifacts/local_${{ matrix.shorten }}
          if-no-files-found: warn
