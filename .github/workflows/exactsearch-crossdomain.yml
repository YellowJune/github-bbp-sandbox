name: Cross-domain ExactSearch validation

on:
  push:
    paths:
      - 'experiments/exactsearch_crossdomain_test.py'
      - '.github/workflows/exactsearch-crossdomain.yml'
  workflow_dispatch:

jobs:
  crossdomain:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' accelerate datasets
      - name: Run cross-domain validation
        run: python experiments/exactsearch_crossdomain_test.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exactsearch-crossdomain-result
          path: experiments/artifacts/exactsearch_crossdomain.json
          if-no-files-found: ignore
