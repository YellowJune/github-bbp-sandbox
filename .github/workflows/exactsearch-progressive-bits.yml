name: Fully progressive ExactSearch bit test

on:
  push:
    paths:
      - 'experiments/exactsearch_progressive_bits.py'
      - '.github/workflows/exactsearch-progressive-bits.yml'
  workflow_dispatch:

jobs:
  progressive:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' accelerate datasets
      - name: Run progressive bit test
        run: python experiments/exactsearch_progressive_bits.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exactsearch-progressive-bits-result
          path: experiments/artifacts/exactsearch_progressive_bits.json
          if-no-files-found: ignore
