name: CIPHER SC quick QE matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/qe_quick_one.py'
      - '.github/workflows/cipher-sc-qe-quick-matrix.yml'
  workflow_dispatch:

jobs:
  variant:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        v: [parent, LaN_apical, LaN_planar, YN_apical, YN_planar, BiN_apical, BiN_planar, TlN_apical, TlN_planar]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QE 7.5
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin wget
          wget -q 'https://github.com/pranabdas/espresso/releases/download/qe-7.5-1/quantum-espresso_7.5-1_amd64.deb' -O /tmp/qe75.deb
          echo 'b759b77935649a84985a2149329a4682f084a450a013b18cf2a12ff47dedf30c  /tmp/qe75.deb' | sha256sum -c -
          sudo apt-get install -y /tmp/qe75.deb
          pip install 'numpy<2.3'
      - name: Fetch SSSP
        run: |
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.tar.gz?download=1' -O /tmp/s.tar.gz
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.json?download=1' -O /tmp/s.json
          echo 'f8cc8b73c5736fca6a9a6cb14813db9b  /tmp/s.tar.gz' | md5sum -c -
          mkdir -p /tmp/pp /tmp/qq
          tar -xzf /tmp/s.tar.gz -C /tmp/pp
      - name: Run ${{ matrix.v }}
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python experiments/qe_quick_one.py \
            --only '${{ matrix.v }}' --ppdir /tmp/pp --meta /tmp/s.json \
            --scratch '/tmp/qq/${{ matrix.v }}' \
            --output 'artifacts/qe_matrix/${{ matrix.v }}'
      - name: Print result
        if: always()
        run: cat 'artifacts/qe_matrix/${{ matrix.v }}/quick_screen.csv' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qe-matrix-${{ matrix.v }}
          path: artifacts/qe_matrix/${{ matrix.v }}
          if-no-files-found: warn
