name: CIPHER SC ultraquick QE matrix

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/qe_ultraquick_one.py'
      - '.github/workflows/cipher-sc-qe-ultraquick.yml'

jobs:
  ultra:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        variant: [parent, LaN_apical, LaN_planar, YN_apical, YN_planar, BiN_apical, BiN_planar, TlN_apical, TlN_planar]
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QE 7.5
        run: |
          wget -q 'https://github.com/pranabdas/espresso/releases/download/qe-7.5-1/quantum-espresso_7.5-1_amd64.deb' -O /tmp/qe.deb
          echo 'b759b77935649a84985a2149329a4682f084a450a013b18cf2a12ff47dedf30c  /tmp/qe.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qe.deb >/dev/null
          pip install -q 'numpy<2.3' pandas
      - name: Fetch SSSP
        run: |
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.tar.gz?download=1' -O /tmp/s.tar.gz
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.json?download=1' -O /tmp/s.json
          mkdir -p /tmp/pp
          tar -xzf /tmp/s.tar.gz -C /tmp/pp
      - name: Run ${{ matrix.variant }} ultraquick
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python experiments/qe_ultraquick_one.py --only '${{ matrix.variant }}' --ppdir /tmp/pp --meta /tmp/s.json --output artifacts/${{ matrix.variant }} --scratch /tmp/u_${{ matrix.variant }}
      - name: Print
        if: always()
        run: cat artifacts/${{ matrix.variant }}/quick_screen.csv || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uq-${{ matrix.variant }}
          path: artifacts/${{ matrix.variant }}
          if-no-files-found: warn
