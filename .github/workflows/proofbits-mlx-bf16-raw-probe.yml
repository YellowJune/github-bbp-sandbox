name: ProofBits MLX BF16 raw storage probe
on:
  push:
    paths:
      - 'benchmarks/proofbits_mlx_bf16_raw_probe.py'
      - '.github/workflows/proofbits-mlx-bf16-raw-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade mlx mlx-lm numpy
      - run: python benchmarks/proofbits_mlx_bf16_raw_probe.py
