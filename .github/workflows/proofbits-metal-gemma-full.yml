name: ProofBits full Metal Gemma decision benchmark
on:
  push:
    paths:
      - 'benchmarks/prepare_proofbits_gemma_metal_data.py'
      - 'benchmarks/proofbits_metal_head.metal'
      - 'benchmarks/proofbits_metal_full_bench.swift'
      - '.github/workflows/proofbits-metal-gemma-full.yml'
  workflow_dispatch:
jobs:
  bench:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch numpy
          python -m pip install 'transformers>=4.55,<5' accelerate datasets
      - run: python benchmarks/prepare_proofbits_gemma_metal_data.py
      - name: Compile Metal and Swift
        run: |
          xcrun -sdk macosx metal -c benchmarks/proofbits_metal_head.metal -o /tmp/proofbits_head.air
          xcrun -sdk macosx metallib /tmp/proofbits_head.air -o /tmp/proofbits_head.metallib
          swiftc -O -framework Metal benchmarks/proofbits_metal_full_bench.swift -o /tmp/proofbits_metal_full
      - name: Run Gemma full accelerator decision benchmark
        run: |
          /tmp/proofbits_metal_full benchmarks/tmp_proofbits_gemma /tmp/proofbits_head.metallib 12 3 | tee /tmp/gemma_full_stdout.json
          mkdir -p experiments/artifacts
          cp benchmarks/tmp_proofbits_gemma/proofbits_metal_full.json experiments/artifacts/proofbits_metal_gemma_full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofbits-metal-gemma-full
          path: experiments/artifacts/proofbits_metal_gemma_full.json
          if-no-files-found: warn
