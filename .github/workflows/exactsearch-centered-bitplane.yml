name: Centered progressive bit-plane ExactSearch kill-test

on:
  push:
    paths:
      - 'experiments/exactsearch_centered_bitplane_killtest.py'
      - '.github/workflows/exactsearch-centered-bitplane.yml'
  workflow_dispatch:

jobs:
  centered:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' accelerate datasets
      - name: Run centered bit-plane test
        run: python experiments/exactsearch_centered_bitplane_killtest.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exactsearch-centered-bitplane-result
          path: experiments/artifacts/exactsearch_centered_bitplane.json
          if-no-files-found: ignore
