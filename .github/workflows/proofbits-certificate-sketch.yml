name: ProofBits certificate-sketch Pareto ablation
on:
  push:
    paths:
      - 'experiments/proofbits_certificate_sketch_ablation.py'
      - '.github/workflows/proofbits-certificate-sketch.yml'
  workflow_dispatch:

jobs:
  sketch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' accelerate datasets
      - name: Run certificate-sketch ablation
        run: python experiments/proofbits_certificate_sketch_ablation.py
      - uses: actions/upload-artifact@v4
        with:
          name: proofbits-certificate-sketch-result
          path: experiments/artifacts/proofbits_certificate_sketch.json
          if-no-files-found: error
