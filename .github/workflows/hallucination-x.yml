name: hallucination-x-ab

on:
  push:
    branches: [hallucination-x-bench]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: HuggingFaceTB/SmolLM2-360M-Instruct
            slug: smollm2-360m
          - model: Qwen/Qwen2.5-0.5B-Instruct
            slug: qwen2.5-0.5b
    runs-on: ubuntu-latest
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.48,<5" sentencepiece safetensors accelerate
      - name: Run paired hallucination benchmark
        run: |
          mkdir -p results
          python benchmark/hallucination_bench.py \
            --model "${{ matrix.model }}" \
            --omega benchmark/OMEGA_HALLUCINATION_X_v3.0_MAX.json \
            --out "results/${{ matrix.slug }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hallucination-x-${{ matrix.slug }}
          path: results/
          if-no-files-found: warn
