name: Exact ordered Sc3Mg3Cu6N4O8 structural falsification

on:
  pull_request:
    paths:
      - 'sc3mg3_ordered/**'
      - '.github/workflows/sc3mg3-ordered-validate.yml'
  workflow_dispatch:

jobs:
  relax:
    strategy:
      fail-fast: false
      matrix:
        ordering: [dispersed, N_aligned, N_away]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CHGNet stack
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<2.3' ase pymatgen chgnet
      - name: Relax exact ordered candidate at 0 and 400 atm
        run: |
          python sc3mg3_ordered/chgnet_validate.py \
            --ordering '${{ matrix.ordering }}' \
            --out 'results/${{ matrix.ordering }}'
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sc3mg3-${{ matrix.ordering }}
          path: results/${{ matrix.ordering }}
