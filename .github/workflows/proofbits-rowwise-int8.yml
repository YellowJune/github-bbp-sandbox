name: Row-wise INT8 ProofBits kill-test
on:
  push:
    paths:
      - 'experiments/proofbits_rowwise_int8_killtest.py'
      - '.github/workflows/proofbits-rowwise-int8.yml'
  workflow_dispatch:

jobs:
  rowwise:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' accelerate datasets
      - name: Run row-wise ProofBits test
        run: python experiments/proofbits_rowwise_int8_killtest.py
      - uses: actions/upload-artifact@v4
        with:
          name: proofbits-rowwise-int8-result
          path: experiments/artifacts/proofbits_rowwise_int8.json
          if-no-files-found: error
