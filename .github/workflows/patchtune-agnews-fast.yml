name: PatchTune AG News fast replicate

on:
  push:
    paths:
      - 'experiments/patchtune_agnews_fast.py'
      - '.github/workflows/patchtune-agnews-fast.yml'
  workflow_dispatch:

jobs:
  agnews-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' accelerate safetensors datasets
      - name: Run fast AG News replicate
        working-directory: experiments
        run: python patchtune_agnews_fast.py
      - name: Upload fast result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchtune-agnews-fast-result
          path: |
            experiments/patchtune_agnews_fast_result.json
            experiments/artifacts/*
          if-no-files-found: ignore
