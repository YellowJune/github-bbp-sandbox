name: MOSAIC-RAG real pretrained smoke

on:
  push:
    branches: [mosaic-rag-exp-20260905]
    paths:
      - '.github/workflows/mosaic-rag-real-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mosaic-rag-exp-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch transformers accelerate datasets scipy scikit-learn sentencepiece
      - name: Patch script for CPU
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/mosaic_rag_real.py')
          s=p.read_text()
          s=s.replace('    if not torch.cuda.is_available():\n        raise RuntimeError("This pilot is intended for the CUDA self-hosted runner")\n    device = torch.device("cuda")\n    gpu_name = torch.cuda.get_device_name(0)\n    print(f"GPU={gpu_name}")', '    device = torch.device("cuda" if torch.cuda.is_available() else "cpu")\n    gpu_name = torch.cuda.get_device_name(0) if torch.cuda.is_available() else "GitHub-hosted CPU"\n    print(f"DEVICE={gpu_name}")')
          s=s.replace('    dtype = torch.float16\n','    dtype = torch.float16 if torch.cuda.is_available() else torch.float32\n')
          s=s.replace('gc.collect(); torch.cuda.empty_cache()', 'gc.collect();\n        if torch.cuda.is_available():\n            torch.cuda.empty_cache()')
          p.write_text(s)
          PY
          python -m py_compile experiments/mosaic_rag_real.py
      - name: Run real one-example held-out smoke
        run: |
          python experiments/mosaic_rag_real.py \
            --model HuggingFaceTB/SmolLM2-135M-Instruct \
            --train-examples 1 \
            --cal-examples 1 \
            --test-examples 1 \
            --trace-examples 100 \
            --docs 3 \
            --max-chunk-tokens 16 \
            --generation-tokens 3 \
            --seed 17 \
            --output experiments/artifacts/mosaic_rag_real_smoke.json
      - name: Print artifact
        if: always()
        run: |
          if [ -f experiments/artifacts/mosaic_rag_real_smoke.json ]; then
            cat experiments/artifacts/mosaic_rag_real_smoke.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mosaic-rag-real-smoke
          path: experiments/artifacts/mosaic_rag_real_smoke.json
          if-no-files-found: warn
