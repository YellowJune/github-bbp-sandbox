name: ProofBits macOS Metal MPS probe
on:
  push:
    paths:
      - '.github/workflows/proofbits-macos-mps-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hardware and Metal diagnostics
        run: |
          uname -a
          system_profiler SPHardwareDataType || true
          system_profiler SPDisplaysDataType || true
          xcrun --find metal || true
          xcrun metal -v || true
      - name: PyTorch MPS probe
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch
          python - <<'PY'
          import json, platform, torch
          out = {
            'platform': platform.platform(),
            'machine': platform.machine(),
            'torch': torch.__version__,
            'mps_built': bool(torch.backends.mps.is_built()),
            'mps_available': bool(torch.backends.mps.is_available()),
          }
          if out['mps_available']:
            x=torch.randn(2048,2048,device='mps',dtype=torch.float16)
            y=x@x
            torch.mps.synchronize()
            out['mps_test_sum']=float(y.float().sum().cpu())
          print(json.dumps(out,indent=2))
          open('/tmp/proofbits_mps_probe.json','w').write(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofbits-macos-mps-probe
          path: /tmp/proofbits_mps_probe.json
          if-no-files-found: warn
