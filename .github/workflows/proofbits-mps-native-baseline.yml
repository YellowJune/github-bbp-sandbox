name: ProofBits native MPS dense baseline
on:
  push:
    paths:
      - 'benchmarks/proofbits_mps_native_baseline.py'
      - 'benchmarks/prepare_proofbits_cpu_avx_data.py'
      - '.github/workflows/proofbits-mps-native-baseline.yml'
  workflow_dispatch:
jobs:
  bench:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch numpy
          python -m pip install 'transformers>=4.55,<5' accelerate datasets
      - run: python benchmarks/prepare_proofbits_cpu_avx_data.py
      - run: python benchmarks/proofbits_mps_native_baseline.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofbits-mps-native-baseline
          path: experiments/artifacts/proofbits_mps_native_baseline.json
          if-no-files-found: warn
