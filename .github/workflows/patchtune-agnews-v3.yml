name: PatchTune AG News v3

on:
  push:
    paths:
      - 'experiments/patchtune_agnews_v3.py'
      - '.github/workflows/patchtune-agnews-v3.yml'
  workflow_dispatch:

jobs:
  agnews-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.45,<5' accelerate safetensors datasets
      - name: Run AG News real downstream test
        working-directory: experiments
        run: python patchtune_agnews_v3.py
      - name: Upload results and serialized states
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patchtune-agnews-v3-result
          path: |
            experiments/patchtune_agnews_v3_result.json
            experiments/artifacts/*
          if-no-files-found: ignore
