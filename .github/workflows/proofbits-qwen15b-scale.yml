name: Qwen 1.5B ProofBits scaling
on:
  push:
    paths:
      - 'experiments/proofbits_qwen15b_scale.py'
      - '.github/workflows/proofbits-qwen15b-scale.yml'
  workflow_dispatch:
jobs:
  scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.55,<5' accelerate datasets
      - run: python experiments/proofbits_qwen15b_scale.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofbits-qwen15b-scale
          path: experiments/artifacts/proofbits_qwen15b_scale.json
          if-no-files-found: warn
