name: Qwen2.5-1.5B upper-only ProofBits scale-up
on:
  push:
    paths:
      - 'experiments/proofbits_upperonly_qwen15b.py'
      - '.github/workflows/proofbits-upperonly-qwen15b.yml'
  workflow_dispatch:
jobs:
  scaleup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.55,<5' accelerate datasets
      - run: python experiments/proofbits_upperonly_qwen15b.py
      - uses: actions/upload-artifact@v4
        with:
          name: proofbits-upperonly-qwen15b
          path: experiments/artifacts/proofbits_upperonly_qwen15b.json
          if-no-files-found: error
