name: NaMg2Sc3Cu6N3O9 low-pressure multistart validation
on:
  pull_request:
    paths:
      - 'namg2sc3cu6n3o9/**'
      - '.github/workflows/namg2sc3cu6n3o9-validate.yml'
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        name: [NaMg5Cu6O12, candidate_dispersed, candidate_stripe, candidate_clustered]
        a0: ['3.55','3.70']
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install structural model
        run: pip install --quiet chgnet ase pymatgen
      - name: Relax at 0 and 400 atm
        run: python namg2sc3cu6n3o9/chgnet_validate.py --name ${{ matrix.name }} --a0 ${{ matrix.a0 }} --out artifacts/${{ matrix.name }}_${{ matrix.a0 }}
      - if: always()
        run: cat artifacts/${{ matrix.name }}_${{ matrix.a0 }}/result.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scn-${{ matrix.name }}-${{ matrix.a0 }}
          path: artifacts/${{ matrix.name }}_${{ matrix.a0 }}
