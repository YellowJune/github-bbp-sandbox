name: Undoped parent Ag-F QE control

on:
  pull_request:
    branches: [main]
    paths:
      - 'agf_parent_control/**'
      - '.github/workflows/agf-parent-qe-control.yml'
  workflow_dispatch:

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q chgnet pymatgen ase
      - name: Relax undoped parent at 0/400 atm
        run: python agf_parent_control/parent_control.py relax --out artifacts/parent
      - uses: actions/upload-artifact@v4
        with:
          name: agf-parent-struct
          path: artifacts/parent

  qe:
    needs: structural
    strategy:
      fail-fast: false
      matrix:
        atm: [0, 400]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: agf-parent-struct
          path: artifacts/parent
      - name: Install QE 7.5
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q 'https://github.com/pranabdas/espresso/releases/download/qe-7.5-1/quantum-espresso_7.5-1_amd64.deb' -O /tmp/qe75.deb
          sudo apt-get install -y /tmp/qe75.deb
          pip install -q 'numpy<2.3' pymatgen
      - name: Fetch SSSP
        run: |
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.tar.gz?download=1' -O /tmp/s.tar.gz
          mkdir -p /tmp/pp
          tar -xzf /tmp/s.tar.gz -C /tmp/pp
      - name: Map parent exchange
        run: python agf_parent_control/parent_control.py qe --cif artifacts/parent/parent_${{ matrix.atm }}atm.cif --atm ${{ matrix.atm }} --ppdir /tmp/pp --out artifacts/qe/${{ matrix.atm }}atm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agf-parent-qe-${{ matrix.atm }}atm
          path: artifacts/qe/${{ matrix.atm }}atm
