name: CIPHER SC QE oxynitride falsification

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/qe_oxynitride_scan.py'
      - '.github/workflows/cipher-sc-qe-oxynitride.yml'
  workflow_dispatch:

jobs:
  qe_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Quantum ESPRESSO and analysis stack
        run: |
          sudo apt-get update
          sudo apt-get install -y quantum-espresso openmpi-bin wget
          python -m pip install --upgrade pip
          pip install 'numpy<2.3' ase pandas
          command -v pw.x
          command -v projwfc.x

      - name: Download SSSP 1.2.1 PBE efficiency pseudopotentials
        run: |
          mkdir -p pseudo/SSSP_1.2.1_PBE_efficiency
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.tar.gz?download=1' -O /tmp/sssp.tar.gz
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.json?download=1' -O pseudo/SSSP_1.2.1_PBE_efficiency.json
          echo 'f8cc8b73c5736fca6a9a6cb14813db9b  /tmp/sssp.tar.gz' | md5sum -c -
          rm -rf /tmp/pp /tmp/pps
          mkdir -p /tmp/pp /tmp/pps
          tar -xzf /tmp/sssp.tar.gz -C /tmp/pp
          test -s pseudo/SSSP_1.2.1_PBE_efficiency.json
          cp /tmp/pp/Ba.pbe-spn-kjpaw_psl.1.0.0.UPF /tmp/pps/Ba.UPF
          cp /tmp/pp/Cu.paw.z_11.ld1.psl.v1.0.0-low.upf /tmp/pps/Cu.UPF
          cp /tmp/pp/Hg_ONCV_PBE-1.0.oncvpsp.upf /tmp/pps/Hg.UPF
          cp /tmp/pp/O.pbe-n-kjpaw_psl.0.1.UPF /tmp/pps/O.UPF
          cp /tmp/pp/N.pbe-n-radius_5.UPF /tmp/pps/N.UPF
          cp /tmp/pp/La.paw.z_11.atompaw.wentzcovitch.v1.2.upf /tmp/pps/La.UPF
          ls -l /tmp/pps

      - name: Run same-pipeline Hg1201 parent and N/La interventions
        run: |
          python experiments/qe_oxynitride_scan.py \
            --pseudo-dir /tmp/pps \
            --sssp-json pseudo/SSSP_1.2.1_PBE_efficiency.json \
            --scratch-dir /tmp/cq \
            --output-dir artifacts/cipher_sc_qe_oxynitride

      - name: Print summary
        if: always()
        run: |
          cat artifacts/cipher_sc_qe_oxynitride/qe_summary.csv || true
          cat artifacts/cipher_sc_qe_oxynitride/summary.json || true

      - name: Upload QE results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cipher-sc-qe-oxynitride
          path: artifacts/cipher_sc_qe_oxynitride
          if-no-files-found: warn
