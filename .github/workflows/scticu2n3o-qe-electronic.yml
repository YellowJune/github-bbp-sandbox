name: ScTiCu2N3O QE electronic validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scticu2n3o/qe_electronic_validate.py'
      - '.github/workflows/scticu2n3o-qe-electronic.yml'
  workflow_dispatch:

concurrency:
  group: scti-qe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qe:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        name: [CaCuO2, Cu3N, ScTiCu2N3O]
    runs-on: ubuntu-latest
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QE 7.5
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin wget
          wget -q 'https://github.com/pranabdas/espresso/releases/download/qe-7.5-1/quantum-espresso_7.5-1_amd64.deb' -O /tmp/qe75.deb
          echo 'b759b77935649a84985a2149329a4682f084a450a013b18cf2a12ff47dedf30c  /tmp/qe75.deb' | sha256sum -c -
          sudo apt-get install -y /tmp/qe75.deb
          pip install -q 'numpy<2.3'
      - name: Fetch SSSP
        run: |
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.tar.gz?download=1' -O /tmp/s.tar.gz
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.json?download=1' -O /tmp/s.json
          echo 'f8cc8b73c5736fca6a9a6cb14813db9b  /tmp/s.tar.gz' | md5sum -c -
          mkdir -p /tmp/pp /tmp/sctiqe
          tar -xzf /tmp/s.tar.gz -C /tmp/pp
      - name: Run PBE and PBE+U
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python scticu2n3o/qe_electronic_validate.py \
            --name '${{ matrix.name }}' --ppdir /tmp/pp --meta /tmp/s.json \
            --scratch '/tmp/sctiqe/${{ matrix.name }}' \
            --out 'artifacts/sctiqe/${{ matrix.name }}'
      - name: Print
        if: always()
        run: cat 'artifacts/sctiqe/${{ matrix.name }}/qe_electronic.csv' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scti-qe-${{ matrix.name }}
          path: artifacts/sctiqe/${{ matrix.name }}
          if-no-files-found: warn
