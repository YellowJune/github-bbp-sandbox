name: MOSAIC-RAG real pretrained no-leak pilot

on:
  push:
    branches: [mosaic-rag-exp-20260905]
    paths:
      - '.github/workflows/mosaic-rag-real-noleak.yml'
  workflow_dispatch:

jobs:
  pilot_noleak:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mosaic-rag-exp-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch transformers accelerate datasets scipy scikit-learn sentencepiece
      - name: Patch CPU and remove gold-support predictor leakage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('experiments/mosaic_rag_real.py')
          s=p.read_text()
          s=s.replace('    if not torch.cuda.is_available():\n        raise RuntimeError("This pilot is intended for the CUDA self-hosted runner")\n    device = torch.device("cuda")\n    gpu_name = torch.cuda.get_device_name(0)\n    print(f"GPU={gpu_name}")', '    device = torch.device("cuda" if torch.cuda.is_available() else "cpu")\n    gpu_name = torch.cuda.get_device_name(0) if torch.cuda.is_available() else "GitHub-hosted CPU"\n    print(f"DEVICE={gpu_name}")')
          s=s.replace('    dtype = torch.float16\n','    dtype = torch.float16 if torch.cuda.is_available() else torch.float32\n')
          s=s.replace('                        float(data["support_flags"][cidx]),\n', '                        0.0,  # gold supporting-fact label deliberately excluded\n')
          s=s.replace('gc.collect(); torch.cuda.empty_cache()', 'gc.collect();\n        if torch.cuda.is_available():\n            torch.cuda.empty_cache()')
          p.write_text(s)
          PY
          python -m py_compile experiments/mosaic_rag_real.py
          ! grep -q 'float(data\["support_flags"\]\[cidx\])' experiments/mosaic_rag_real.py
      - name: Run no-leak SmolLM2 / HotpotQA pilot
        run: |
          python experiments/mosaic_rag_real.py \
            --model HuggingFaceTB/SmolLM2-135M-Instruct \
            --train-examples 2 \
            --cal-examples 2 \
            --test-examples 3 \
            --trace-examples 300 \
            --docs 4 \
            --max-chunk-tokens 24 \
            --generation-tokens 6 \
            --seed 17 \
            --output experiments/artifacts/mosaic_rag_real_smollm135_cpu_noleak.json
      - name: Print compact artifact summary
        if: always()
        run: |
          if [ -f experiments/artifacts/mosaic_rag_real_smollm135_cpu_noleak.json ]; then
            python - <<'PY'
          import json
          d=json.load(open('experiments/artifacts/mosaic_rag_real_smollm135_cpu_noleak.json'))
          print('FINAL_ARTIFACT_SUMMARY=' + json.dumps({k:d[k] for k in ['metadata','trace','predictor','aggregate','generation']}, ensure_ascii=False, separators=(',',':')))
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mosaic-rag-real-smollm135-cpu-noleak
          path: experiments/artifacts/mosaic_rag_real_smollm135_cpu_noleak.json
          if-no-files-found: warn
