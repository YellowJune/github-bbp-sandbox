name: Sc3Ti3Cu6N10O2 final isolated validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'sc3final/**'
      - '.github/workflows/sc3-final-validate.yml'
  workflow_dispatch:

concurrency:
  group: sc3-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      advance: ${{ steps.decision.outputs.advance }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CHGNet structural stack
        run: pip install -q chgnet pymatgen ase
      - name: Relax candidate at 0 and 400 atm
        env:
          OMP_NUM_THREADS: '2'
        run: python sc3final/structural.py
      - name: Gate QE by preregistered structural criterion
        id: decision
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/struct/ADVANCE ]; then
            echo "advance=$(cat artifacts/struct/ADVANCE)" >> "$GITHUB_OUTPUT"
          else
            echo 'advance=0' >> "$GITHUB_OUTPUT"
          fi
          cat artifacts/struct/result.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc3-final-struct
          path: artifacts/struct
          if-no-files-found: warn

  qe:
    needs: structural
    if: needs.structural.outputs.advance == '1'
    strategy:
      fail-fast: false
      matrix:
        pressure: [0, 400]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sc3-final-struct
          path: artifacts/struct
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install QE 7.5 and parser
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin wget
          wget -q 'https://github.com/pranabdas/espresso/releases/download/qe-7.5-1/quantum-espresso_7.5-1_amd64.deb' -O /tmp/qe75.deb
          echo 'b759b77935649a84985a2149329a4682f084a450a013b18cf2a12ff47dedf30c  /tmp/qe75.deb' | sha256sum -c -
          sudo apt-get install -y /tmp/qe75.deb
          pip install -q 'numpy<2.3' pymatgen
      - name: Fetch SSSP 1.2.1 PBE efficiency
        run: |
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.tar.gz?download=1' -O /tmp/s.tar.gz
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.json?download=1' -O /tmp/s.json
          echo 'f8cc8b73c5736fca6a9a6cb14813db9b  /tmp/s.tar.gz' | md5sum -c -
          mkdir -p /tmp/pp /tmp/sc3q
          tar -xzf /tmp/s.tar.gz -C /tmp/pp
      - name: Select relaxed structure and run PBE/PBE+U
        env:
          OMP_NUM_THREADS: '2'
        shell: bash
        run: |
          if [ '${{ matrix.pressure }}' = '0' ]; then
            CIF='artifacts/struct/relaxed_0.00000000GPa.cif'
          else
            CIF='artifacts/struct/relaxed_0.04053000GPa.cif'
          fi
          python sc3final/qe_relaxed.py --cif "$CIF" --pressure-atm '${{ matrix.pressure }}' \
            --ppdir /tmp/pp --meta /tmp/s.json --scratch '/tmp/sc3q/${{ matrix.pressure }}' \
            --out 'artifacts/qe/${{ matrix.pressure }}atm'
      - name: Print QE result
        if: always()
        run: cat 'artifacts/qe/${{ matrix.pressure }}atm/qe_electronic.csv' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sc3-final-qe-${{ matrix.pressure }}atm
          path: artifacts/qe/${{ matrix.pressure }}atm
          if-no-files-found: warn
