name: Uncertainty-guided exact top-p ProofBits
on:
  push:
    paths:
      - 'experiments/proofbits_topp_uncertainty_adaptive.py'
      - '.github/workflows/proofbits-topp-uncertainty.yml'
  workflow_dispatch:
jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.55,<5' accelerate datasets
      - run: python experiments/proofbits_topp_uncertainty_adaptive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofbits-topp-uncertainty
          path: experiments/artifacts/proofbits_topp_uncertainty_adaptive.json
          if-no-files-found: warn
