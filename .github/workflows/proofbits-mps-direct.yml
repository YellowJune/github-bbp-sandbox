name: ProofBits direct MPSMatrixVector dense baseline
on:
  push:
    paths:
      - 'benchmarks/prepare_proofbits_cpu_avx_data.py'
      - 'benchmarks/proofbits_mps_argmax.metal'
      - 'benchmarks/proofbits_mps_direct.swift'
      - '.github/workflows/proofbits-mps-direct.yml'
  workflow_dispatch:
jobs:
  bench:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch numpy
          python -m pip install 'transformers>=4.55,<5' accelerate datasets
      - run: python benchmarks/prepare_proofbits_cpu_avx_data.py
      - name: Compile MPS argmax Metal and Swift host
        run: |
          xcrun -sdk macosx metal -c benchmarks/proofbits_mps_argmax.metal -o /tmp/mps_argmax.air
          xcrun -sdk macosx metallib /tmp/mps_argmax.air -o /tmp/mps_argmax.metallib
          swiftc -O -framework Metal -framework MetalPerformanceShaders benchmarks/proofbits_mps_direct.swift -o /tmp/proofbits_mps_direct
      - name: Run direct Apple MPS matrix-vector baseline
        run: |
          /tmp/proofbits_mps_direct benchmarks/tmp_proofbits_cpu /tmp/mps_argmax.metallib 20 3 | tee /tmp/mps_direct_stdout.json
          mkdir -p experiments/artifacts
          cp benchmarks/tmp_proofbits_cpu/proofbits_mps_direct.json experiments/artifacts/proofbits_mps_direct.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofbits-mps-direct
          path: experiments/artifacts/proofbits_mps_direct.json
          if-no-files-found: warn
