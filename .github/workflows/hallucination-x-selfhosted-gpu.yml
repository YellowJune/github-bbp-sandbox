name: hallucination-x-selfhosted-gpu

on:
  push:
    branches: [hallucination-x-bench]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify GPU
        run: nvidia-smi
      - name: Install inference dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch transformers accelerate sentencepiece safetensors
      - name: Run Qwen 0.5B paired benchmark
        run: |
          mkdir -p results
          python benchmark/hallucination_bench.py \
            --model Qwen/Qwen2.5-0.5B-Instruct \
            --omega benchmark/OMEGA_HALLUCINATION_X_v3.0_MAX.json \
            --out results/qwen2.5-0.5b.json
      - name: Run SmolLM2 360M paired benchmark
        run: |
          python benchmark/hallucination_bench.py \
            --model HuggingFaceTB/SmolLM2-360M-Instruct \
            --omega benchmark/OMEGA_HALLUCINATION_X_v3.0_MAX.json \
            --out results/smollm2-360m.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hallucination-x-selfhosted-gpu-results
          path: results/
          if-no-files-found: warn
