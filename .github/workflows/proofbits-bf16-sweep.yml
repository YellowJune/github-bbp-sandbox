name: BF16 ProofBits prefix sweep
on:
  push:
    paths:
      - 'experiments/proofbits_bf16_prefix_sweep.py'
      - '.github/workflows/proofbits-bf16-sweep.yml'
  workflow_dispatch:
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.55,<5' accelerate datasets
      - run: python experiments/proofbits_bf16_prefix_sweep.py
      - uses: actions/upload-artifact@v4
        with:
          name: proofbits-bf16-prefix-sweep
          path: experiments/artifacts/proofbits_bf16_prefix_sweep.json
          if-no-files-found: error
