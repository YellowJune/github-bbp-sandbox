name: ProofBits Triton static checks
on:
  push:
    paths:
      - 'kernels/proofbits_triton_4plus4.py'
      - '.github/workflows/proofbits-triton-static.yml'
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install triton
      - name: Syntax and packing self-test
        run: |
          python -m py_compile kernels/proofbits_triton_4plus4.py
          python kernels/proofbits_triton_4plus4.py
