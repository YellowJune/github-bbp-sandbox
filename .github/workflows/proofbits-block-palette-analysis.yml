name: ProofBits block palette analysis
on:
  push:
    paths:
      - 'experiments/proofbits_block_palette_analysis.py'
      - '.github/workflows/proofbits-block-palette-analysis.yml'
  workflow_dispatch:
jobs:
  analyze:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade mlx mlx-lm numpy
      - run: python experiments/proofbits_block_palette_analysis.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofbits-block-palette-analysis
          path: experiments/artifacts/proofbits_block_palette_analysis.json
          if-no-files-found: warn
