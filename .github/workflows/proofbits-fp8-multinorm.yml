name: Multi-Holder FP8 ProofBits certificate
on:
  push:
    paths:
      - 'experiments/proofbits_fp8_multinorm.py'
      - '.github/workflows/proofbits-fp8-multinorm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.55,<5' accelerate datasets
      - run: python experiments/proofbits_fp8_multinorm.py
      - name: Persist audited JSON
        run: |
          mkdir -p results
          cp experiments/artifacts/proofbits_fp8_multinorm.json results/proofbits_fp8_multinorm.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/proofbits_fp8_multinorm.json
          git commit -m 'Record multi-Holder ProofBits result' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: proofbits-fp8-multinorm
          path: experiments/artifacts/proofbits_fp8_multinorm.json
          if-no-files-found: error
