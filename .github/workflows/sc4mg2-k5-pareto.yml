name: Sc4Mg2Cu6N5O7 exact Pareto validation

on:
  pull_request:
    paths:
      - 'sc4mg2_pareto/**'
      - '.github/workflows/sc4mg2-k5-pareto.yml'
  workflow_dispatch:

jobs:
  relax:
    strategy:
      fail-fast: false
      matrix:
        a0: ['3.60','3.70','3.80']
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CHGNet stack
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<2.3' ase pymatgen chgnet
      - name: Relax candidate and conservative binary references
        run: |
          python sc4mg2_pareto/chgnet_validate.py \
            --a0 '${{ matrix.a0 }}' \
            --out 'results/a${{ matrix.a0 }}'
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sc4mg2-a${{ matrix.a0 }}
          path: results/a${{ matrix.a0 }}
