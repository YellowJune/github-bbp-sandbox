name: CIPHER SC quick ligand QE screen

on:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/qe_quick_ligand_screen.py'
      - '.github/workflows/cipher-sc-qe-quick-ligand.yml'
  workflow_dispatch:

jobs:
  quick_qe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QE 7.5
        run: |
          sudo apt-get update
          sudo apt-get install -y openmpi-bin wget
          wget -q 'https://github.com/pranabdas/espresso/releases/download/qe-7.5-1/quantum-espresso_7.5-1_amd64.deb' -O /tmp/qe75.deb
          echo 'b759b77935649a84985a2149329a4682f084a450a013b18cf2a12ff47dedf30c  /tmp/qe75.deb' | sha256sum -c -
          sudo apt-get install -y /tmp/qe75.deb
          echo '/opt/espresso/7.5' >> "$GITHUB_PATH"
          pip install 'numpy<2.3'

      - name: Fetch SSSP
        run: |
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.tar.gz?download=1' -O /tmp/sssp.tar.gz
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.json?download=1' -O /tmp/sssp.json
          echo 'f8cc8b73c5736fca6a9a6cb14813db9b  /tmp/sssp.tar.gz' | md5sum -c -
          rm -rf /tmp/pp /tmp/qquick
          mkdir -p /tmp/pp /tmp/qquick
          tar -xzf /tmp/sssp.tar.gz -C /tmp/pp
          test -s /tmp/sssp.json

      - name: Fixed-geometry SCF and PDOS screen
        env:
          OMP_NUM_THREADS: '2'
        run: |
          python experiments/qe_quick_ligand_screen.py \
            --ppdir /tmp/pp --meta /tmp/sssp.json \
            --pw /opt/espresso/7.5/pw.x --proj /opt/espresso/7.5/projwfc.x \
            --scratch /tmp/qquick --output artifacts/qe_quick_ligand

      - name: Rank interventions
        if: always()
        run: |
          cat artifacts/qe_quick_ligand/quick_screen.csv || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-quick-ligand-results
          path: artifacts/qe_quick_ligand
          if-no-files-found: warn
