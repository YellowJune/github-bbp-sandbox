name: Pbca AgF2 QE exchange control

on:
  pull_request:
    paths:
      - 'agf_selfclamp/agf2_qe_control.py'
      - '.github/workflows/agf2-qe-control.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QE 7.5 and parser
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -q 'https://github.com/pranabdas/espresso/releases/download/qe-7.5-1/quantum-espresso_7.5-1_amd64.deb' -O /tmp/qe75.deb
          sudo apt-get install -y /tmp/qe75.deb
          pip install -q 'numpy<2.3' pymatgen
      - name: Fetch SSSP PBE efficiency
        run: |
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.tar.gz?download=1' -O /tmp/s.tar.gz
          mkdir -p /tmp/pp
          tar -xzf /tmp/s.tar.gz -C /tmp/pp
      - name: Map known Pbca AgF2 exchange
        run: |
          python agf_selfclamp/agf2_qe_control.py --ppdir /tmp/pp --out artifacts/agf2_control
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agf2-qe-control
          path: |
            artifacts/agf2_control/result.json
            artifacts/agf2_control/AgF2_Pbca_reference.cif
            artifacts/agf2_control/*.in
            artifacts/agf2_control/*.out
          compression-level: 9
