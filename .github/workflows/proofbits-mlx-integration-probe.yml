name: ProofBits MLX integration probe
on:
  push:
    paths:
      - 'benchmarks/proofbits_mlx_integration_probe.py'
      - '.github/workflows/proofbits-mlx-integration-probe.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade mlx mlx-lm
      - run: python benchmarks/proofbits_mlx_integration_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofbits-mlx-integration-probe
          path: experiments/artifacts/proofbits_mlx_integration_probe.json
          if-no-files-found: warn
