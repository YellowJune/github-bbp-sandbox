name: Finite-precision-safe ProofBits certificate stress
on:
  push:
    paths:
      - 'experiments/proofbits_roundoff_safe_certificate.py'
      - '.github/workflows/proofbits-roundoff-safe.yml'
  workflow_dispatch:
jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.55,<5' accelerate datasets
      - run: python -m py_compile experiments/proofbits_roundoff_safe_certificate.py
      - run: python experiments/proofbits_roundoff_safe_certificate.py
      - uses: actions/upload-artifact@v4
        with:
          name: proofbits-roundoff-safe
          path: experiments/artifacts/proofbits_roundoff_safe_certificate.json
          if-no-files-found: error
