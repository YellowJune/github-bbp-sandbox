name: Sign-split FP8 E5M2 ProofBits certificate
on:
  push:
    paths:
      - 'experiments/proofbits_fp8e5m2_signsplit.py'
      - '.github/workflows/proofbits-fp8e5m2-signsplit.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.55,<5' accelerate datasets
      - run: python experiments/proofbits_fp8e5m2_signsplit.py
      - uses: actions/upload-artifact@v4
        with:
          name: proofbits-fp8e5m2-signsplit
          path: experiments/artifacts/proofbits_fp8e5m2_signsplit.json
          if-no-files-found: error
