name: Final upper-only ProofBits stress
on:
  push:
    paths:
      - 'experiments/proofbits_upperonly_final_stress.py'
      - '.github/workflows/proofbits-upperonly-final-stress.yml'
  workflow_dispatch:
jobs:
  stress:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=4.55,<5' accelerate datasets
      - run: python experiments/proofbits_upperonly_final_stress.py
      - uses: actions/upload-artifact@v4
        with:
          name: proofbits-upperonly-final-stress
          path: experiments/artifacts/proofbits_upperonly_final_stress.json
          if-no-files-found: error
