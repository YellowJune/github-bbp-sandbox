name: ProofBits Qwen partial-unroll head stress
on:
  push:
    paths:
      - 'benchmarks/proofbits_mlx_qwen_unroll_headstress.py'
      - '.github/workflows/proofbits-mlx-qwen-unroll-headstress.yml'
  workflow_dispatch:
jobs:
  bench:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade mlx mlx-lm numpy
      - run: python benchmarks/proofbits_mlx_qwen_unroll_headstress.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofbits-qwen-unroll-headstress
          path: experiments/artifacts/proofbits_mlx_qwen_unroll_headstress.json
          if-no-files-found: warn
