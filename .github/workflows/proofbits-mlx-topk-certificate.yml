name: ProofBits top-K exact certificate
on:
  push:
    paths:
      - 'benchmarks/proofbits_mlx_topk_certificate.py'
      - '.github/workflows/proofbits-mlx-topk-certificate.yml'
  workflow_dispatch:
jobs:
  bench:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade mlx mlx-lm numpy
      - run: python benchmarks/proofbits_mlx_topk_certificate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofbits-topk-certificate
          path: experiments/artifacts/proofbits_mlx_topk_certificate.json
          if-no-files-found: warn
