name: CIPHER de novo CuN2 infinite-layer QE

on:
  pull_request:
    branches: [main]
    paths:
      - 'nitride_search/qe_infinite_layer.py'
      - 'nitride_search/qe-infinite-layer.yml'

jobs:
  qe:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [CaCuO2, TiCuN2, ZrCuN2, HfCuN2]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install QE 7.5
        run: |
          wget -q 'https://github.com/pranabdas/espresso/releases/download/qe-7.5-1/quantum-espresso_7.5-1_amd64.deb' -O /tmp/qe.deb
          echo 'b759b77935649a84985a2149329a4682f084a450a013b18cf2a12ff47dedf30c  /tmp/qe.deb' | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y /tmp/qe.deb >/dev/null
          pip install -q 'numpy<2.3' ase
      - name: Fetch SSSP
        run: |
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.tar.gz?download=1' -O /tmp/s.tar.gz
          wget -q 'https://archive.materialscloud.org/records/1dygy-1xb93/files/SSSP_1.2.1_PBE_efficiency.json?download=1' -O /tmp/s.json
          mkdir -p /tmp/pp
          tar -xzf /tmp/s.tar.gz -C /tmp/pp
      - name: vc-relax SCF PDOS ${{ matrix.variant }}
        env: {OMP_NUM_THREADS: '2'}
        run: |
          python nitride_search/qe_infinite_layer.py --variant '${{ matrix.variant }}' --ppdir /tmp/pp --meta /tmp/s.json --output artifacts/${{ matrix.variant }} --scratch /tmp/${{ matrix.variant }}
      - name: Print
        if: always()
        run: cat artifacts/${{ matrix.variant }}/result.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nitride-${{ matrix.variant }}
          path: artifacts/${{ matrix.variant }}
          if-no-files-found: warn
